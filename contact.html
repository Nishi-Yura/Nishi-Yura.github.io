<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-to-top { display: none; }
        .contact-content {
            margin-top: 6rem;
            max-width: 100%;
        }
        .contact-message {
            font-size: 1.2rem;
            line-height: 2;
            margin-bottom: 4rem;
            color: #333;
        }
        .contact-form {
            width: 100%;
        }
        .form-group {
            margin-bottom: 3rem;
        }
        .form-label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            font-size: 1.1rem;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 1rem 0;
            border: none;
            border-bottom: 1px solid #ddd;
            background: transparent;
            font-family: inherit;
            font-size: 1.2rem;
            transition: border-color 0.3s ease;
        }
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-bottom-color: #1a1a1a;
        }
        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-submit {
            display: inline-block;
            padding: 1rem 4rem;
            background-color: transparent;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            font-size: 1.1rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .form-submit:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        @media screen and (max-width: 768px) {
            .contact-message {
                font-size: 1rem;
            }
            .form-submit {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

                    <li><a href="https://x.com/46nek_0" target="_blank" rel="noopener noreferrer" class="nav__link">X/TWITTER</a></li>
                </ul>
            </nav>
            <div class="header__logo"><a href="index.html">Nishimoto Yura</a></div>
        </div>
    </header>

    <main class="page-top-padding">
        <section class="section">
            <div class="container">
                <h1 class="section-title fade-in">CONTACT</h1>
                
                <div class="contact-content">
                    <p class="contact-message fade-in" style="font-size: 1.5rem; line-height: 2.5;">
                        お問い合わせは、以下のメールアドレスまたはXのDMまでお気軽にご連絡ください。<br><br>
                        <strong>Email:</strong> <a href="mailto:nishimoto.yura@gmail.com" style="color: #1a1a1a; text-decoration: underline;">nishimoto.yura@gmail.com</a><br>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__top fade-in">
            <a href="#" class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">↑</a>

        <div class="footer__huge-text fade-in">
            <span class="letter-wrap"><span class="letter">N</span></span><span class="letter-wrap"><span class="letter">I</span></span><span class="letter-wrap"><span class="letter">S</span></span><span class="letter-wrap"><span class="letter">H</span></span><span class="letter-wrap"><span class="letter">I</span></span><span class="letter-wrap"><span class="letter">M</span></span><span class="letter-wrap"><span class="letter">O</span></span><span class="letter-wrap"><span class="letter">T</span></span><span class="letter-wrap"><span class="letter">O</span></span>
            <span class="spacer"></span>
            <span class="letter-wrap"><span class="letter">Y</span></span><span class="letter-wrap"><span class="letter">U</span></span><span class="letter-wrap"><span class="letter">R</span></span><span class="letter-wrap"><span class="letter">A</span></span>
        </div>
    </footer>

    <script src="js/main.js"></script>
